user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # 1. HTTP to HTTPS Redirection (Port 80 -> Port 443)
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # 2. HTTPS Reverse Proxy
    server {
        listen 443 ssl;
        server_name localhost;

        # TLS Certificates Configuration (Dummy paths for volume mounting)
        ssl_certificate /etc/ssl/certs/collision.crt;
        ssl_certificate_key /etc/ssl/private/collision.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Forward completions and health endpoints to FastAPI backend
        location /v1 {
            proxy_pass http://collision-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://collision-api:8000;
        }

        location /ready {
            proxy_pass http://collision-api:8000;
        }

        # Forward dashboard traffic to Streamlit portal (with websocket support)
        location / {
            proxy_pass http://collision-portal:8501;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Streamlit websocket headers (Crucial for Streamlit UI interactions)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
