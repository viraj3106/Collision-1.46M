version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: collision-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collision_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-collision_api}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - collision-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  collision-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: collision-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-collision_admin}:${POSTGRES_PASSWORD:-adminpassword123}@postgres:5432/${POSTGRES_DB:-collision_api}
      MODEL_PATH: /app/models/collision-10m
      MODEL_SHA256: d256d46d962d6416fe22d2cfe80b13df0574279fb980d7d8576c2bdcf3775b97
      MODEL_PARAM_COUNT: 10282304
      COLLISION_RATE_LIMIT: 60
      CORS_ALLOWED_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    volumes:
      # Mount local models directory to container read-only
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    networks:
      - collision-net
    depends_on:
      postgres:
        condition: service_healthy

  collision-portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    container_name: collision-portal
    restart: unless-stopped
    environment:
      COLLISION_API_URL: http://collision-api:8000
    ports:
      - "8501:8501"
    networks:
      - collision-net
    depends_on:
      collision-api:
        condition: service_healthy

volumes:
  pgdata:

networks:
  collision-net:
    driver: bridge
