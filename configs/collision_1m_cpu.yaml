# COLLISION-1M CPU Training Configuration
model:
  vocab_size: 8000
  max_seq_len: 256
  d_model: 128
  n_layer: 3
  n_head: 4
  d_ff: 256
  dropout: 0.1
  tie_embeddings: true

training:
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 6e-4
  max_steps: 5000
  checkpoint_interval: 100
  device: cpu
