# COLLISION-1.0B True Upper Frontier Configuration (999,376,128 Exact Parameters / 1.00B)
model:
  vocab_size: 32000
  max_seq_len: 1024
  d_model: 2048
  n_layer: 24
  n_head: 16
  d_ff: 5376
  dropout: 0.1
  tie_embeddings: true
  normalization: layer_norm
  positional_encoding: absolute_learned

training:
  learning_rate: 1.2e-4
  min_lr: 1.0e-5
  warmup_steps: 4000
  max_steps: 200000
  batch_size: 8
  gradient_accumulation_steps: 128
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 1337
