# COLLISION-3M Configuration
model:
  vocab_size: 8000
  max_seq_len: 256
  d_model: 192
  n_layer: 6
  n_head: 6
  d_ff: 384
  dropout: 0.1
  tie_embeddings: true

training:
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 6e-4
  max_steps: 1500
  seed: 1337
  device: cpu
  training_token_budget: 1536000
  checkpoint_dir: "checkpoints/scaling/collision_3m"
  dataset_version: "collision_dataset_v4"
  tokenizer_dir: "artifacts/tokenizer"
